<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放送委員リクエストリスト</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #333;
        }
        /* 入室ロック画面 */
        .auth-box {
            padding: 25px;
            background: #eef2f3;
            border-radius: 6px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        /* 管理者編集ロック解除画面（入室後に表示） */
        .admin-auth-box {
            margin-bottom: 20px;
            padding: 12px 15px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="password"], input[type="text"] {
            padding: 8px 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 8px 16px;
            border: none;
            background-color: #00bfff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        button:hover {
            background-color: #00b5df;
        }
        /* 放送委員認証後に表示するエリア */
        .protected-content {
            display: none;
        }
        .unlocked .protected-content {
            display: block;
        }
        .unlocked .auth-box {
            display: none;
        }
        /* 管理者編集モード時のみ表示するエリア */
        .edit-area {
            display: none;
            margin-bottom: 20px;
            gap: 10px;
        }
        .edit-mode .edit-area {
            display: flex;
        }
        .edit-mode .admin-auth-box {
            display: none;
        }
        .admin-status-msg {
            display: none;
            font-size: 14px;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .edit-mode .admin-status-msg {
            display: block;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            transition: opacity 0.2s;
        }
        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
        }
        .item-text {
            font-size: 16px;
            color: #333;
        }
        .item-date {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }
        li.checked-item .item-text {
            text-decoration: line-through;
            color: #888;
        }
        li.checked-item {
            background-color: #fafafa;
        }
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        input[type="checkbox"]:disabled {
            cursor: not-allowed;
        }
        .delete-btn {
            display: none;
            background-color: #dc3545;
            padding: 6px 10px;
            font-size: 12px;
            margin-left: 10px;
        }
        .delete-btn:hover {
            background-color: #bd2130;
        }
        .edit-mode .delete-btn {
            display: inline-block;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .member-msg {
            font-size: 14px;
            color: #555;
        }
        .refresh-btn {
            background-color: #6c757d;
            padding: 6px 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>放送委員会 リクエスト曲共有リスト</h1>

    <!-- 1段階目：放送委員用の入室パスワード入力 -->
    <form class="auth-box" onsubmit="memberLogin(event)">
        <input type="password" id="memberPasswordInput" placeholder="放送委員用パスワードを入力" required>
        <button type="submit">リストを開く</button>
    </form>

    <!-- 放送委員認証後に表示される中身 -->
    <div class="protected-content">
        <div class="top-bar">
            <div class="member-msg">閲覧・再生済みチェックが可能です</div>
            <button class="refresh-btn" onclick="loadList()">最新に更新</button>
        </div>

        <!-- 2段階目：管理者用の編集モード解除パスワード入力 -->
        <form class="admin-auth-box" onsubmit="adminLogin(event)">
            <input type="password" id="adminPasswordInput" placeholder="管理者パスワード（追加・削除用）" required>
            <button type="submit" style="background-color: #6c757d;">リストを編集する</button>
        </form>

        <div class="admin-status-msg">管理者モード有効（リストの追加・削除が可能です）</div>

        <div class="edit-area">
            <input type="text" id="newItemInput" placeholder="新しい曲を追加" style="flex-grow: 1;">
            <button onclick="addItem()" style="background-color: #28a745;">追加</button>
        </div>

        <ul id="itemList"></ul>
    </div>
</div>

<script>
    let memberPassword = '';
    let adminPassword = '';

    // 1段階目：放送委員入室ログイン
    async function memberLogin(e) {
        e.preventDefault();
        memberPassword = document.getElementById('memberPasswordInput').value;

        const success = await loadList();
        if (success) {
            document.getElementById('mainContainer').classList.add('unlocked');
        } else {
            memberPassword = '';
            alert('放送委員用パスワードが違います。');
        }
    }

    // 2段階目：管理者編集モード有効化
    async function adminLogin(e) {
        e.preventDefault();
        const input = document.getElementById('adminPasswordInput').value;

        const res = await fetch('/api/verify-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input })
        });

        if (res.ok) {
            adminPassword = input;
            document.getElementById('mainContainer').classList.add('edit-mode');
        } else {
            alert('管理者パスワードが違います。');
        }
    }

    // リスト取得
    async function loadList() {
        const res = await fetch('/api/requests/list', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: memberPassword })
        });

        if (!res.ok) return false;

        const items = await res.json();
        const listElement = document.getElementById('itemList');
        listElement.innerHTML = '';

        if (items.length === 0) {
            listElement.innerHTML = '<li style="color:#888; justify-content:center;">現在リクエストはありません</li>';
            return true;
        }

        items.forEach((item) => {
            const li = document.createElement('li');
            if (item.checked) {
                li.classList.add('checked-item');
            }

            const checkboxHtml = `
                <input type="checkbox" 
                       ${item.checked ? 'checked disabled' : ''} 
                       onchange="lockCheck(${item.id})">
            `;

            li.innerHTML = `
                <div class="item-left">
                    ${checkboxHtml}
                    <div>
                        <span class="item-text">${escapeHtml(item.text)}</span>
                        <span class="item-date">(${item.createdAt})</span>
                    </div>
                </div>
                <button class="delete-btn" onclick="removeItem(${item.id})">削除</button>
            `;
            listElement.appendChild(li);
        });
        return true;
    }

    // チェック（放送委員なら誰でもOK）
    async function lockCheck(id) {
        await fetch(`/api/requests/${id}/check`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: memberPassword })
        });
        loadList();
    }

    // 管理者からの直接追加
    async function addItem() {
        const inputElement = document.getElementById('newItemInput');
        const text = inputElement.value.trim();
        if (!text) return;

        await fetch('/api/requests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });

        inputElement.value = '';
        loadList();
    }

    // 削除（管理者のみ）
    async function removeItem(id) {
        if (!confirm('このリクエストを削除しますか？')) return;
        const res = await fetch(`/api/requests/${id}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminPassword: adminPassword })
        });
        if (res.ok) loadList();
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(match) {
            const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return escape[match];
        });
    }
</script>

</body>
</html>
