<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放送委員会 曲リクエストフォーム</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #333;
        }
        p.desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            background-color: #00bfff;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #00b5df;
        }
        .complete-msg {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>放送委員会 リクエストフォーム</h1>
    <p class="desc">お昼の放送などで流してほしい曲名・アーティスト名を入力して送信してください。</p>

    <form id="requestForm">
        <div class="form-group">
            <label for="songInput">曲名</label>
            <input type="text" id="songInput" placeholder="例:ひこうき雲" required>
        </div>
        <div class="form-group">
            <label for="nameInput">アーティスト名</label>
            <input type="text" id="nameInput" placeholder="荒井 由美">
        </div>
        <button type="submit" id="submitBtn">リクエストを送信する</button>
    </form>

    <div class="complete-msg" id="completeMsg">
        放送委員会のリストに追加されました。リクエストありがとうございます。
    </div>
</div>

<script>
    document.getElementById('requestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '送信中...';

        const song = document.getElementById('songInput').value.trim();
        const name = document.getElementById('nameInput').value.trim();
        // リストに1行で綺麗に表示されるように結合
        const fullText = name ? `${song}（${name}）` : song;

        const res = await fetch('/api/requests', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: fullText })
        });

        btn.disabled = false;
        btn.textContent = 'リクエストを送信する';

        if (res.ok) {
            document.getElementById('songInput').value = '';
            document.getElementById('completeMsg').style.display = 'block';
        } else {
            alert('送信に失敗しました。時間をおいて再度お試しください。');
        }
    });
</script>

</body>
</html>
